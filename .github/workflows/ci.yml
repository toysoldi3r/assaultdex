# Continuous integration: typecheck, lint, unit tests, and a production build on
# every push and pull request. Runs entirely on GitHub infra with no external
# calls — SQLite + committed fixtures mean nothing needs a real database.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Prisma generate reads this; no connection is opened during CI.
      DATABASE_URL: "file:./dev.db"
      NEXT_TELEMETRY_DISABLED: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup@v4 reads the pnpm
      # version from package.json's "packageManager" field. Specifying it in
      # both places makes the action fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall runs `prisma generate`, so the client is ready for typecheck.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
